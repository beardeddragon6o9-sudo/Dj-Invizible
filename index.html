    <!-- DJ Invizible (starts as primary/center) -->
<button id="mascot-invizible" class="mascot primary" aria-label="DJ Invizible">
  <img src="assets/img/invizible.png" alt="DJ Invizible Mascot" class="mascot-img portrait-art">
  <img src="assets/img/ChatGPT%20Image%20Sep%2023%2C%202026%2C%2001_27_51%20PM.png" alt="" class="mascot-img stage-art" aria-hidden="true">
  <span class="summon-label">Summon Invizible</span>
</button>

<!-- Midnite Maverick (starts tucked top-right) -->
<button id="mascot-maverick" class="mascot secondary" aria-label="Midnite Maverick">
  <img src="assets/img/maverick.png" alt="Midnite Maverick Mascot" class="mascot-img portrait-art">
  <img src="assets/img/ChatGPT%20Image%20Sep%2023%2C%202026%2C%2001_50_37%20PM.png" alt="" class="mascot-img stage-art" aria-hidden="true">
  <span class="summon-label">Summon Maverick</span>
</button>

    <div id="mascot-cue" class="hidden" aria-hidden="true"></div>
  </div><!-- masthead -->

  <div id="app">
    <!-- The active mascot speaks through this booth-side chat bubble. -->
    <section id="panel" class="hidden" role="region" aria-label="Chat with the DJ mascot">
      <header id="panel-header">
        <img id="chat-avatar" src="assets/img/invizible.png" alt="" aria-hidden="true" />
        <div class="chat-identity">
          <span id="panel-title">DJ INVIZIBLE</span>
          <span id="panel-subtitle"><span class="presence-dot" aria-hidden="true"></span> AT THE TURNTABLES</span>
        </div>
        <button id="close-panel" type="button" aria-label="Close chat" title="Close chat">&times;</button>
      </header>
      <div id="messages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></div>
      <div id="quick-prompts" aria-label="Conversation starters">
        <button type="button" class="quick-prompt" data-topic="booking">Book a date</button>
        <button type="button" class="quick-prompt" data-topic="mixes">Explore mixes</button>
        <button type="button" class="quick-prompt" data-topic="events">What do you play?</button>
      </div>
      <form id="composer">
        <input id="input" type="text" placeholder="Say something to Invizible..." aria-label="Message DJ Invizible's virtual mascot" autocomplete="off" />
        <button type="submit" id="send">Send <span aria-hidden="true">↗</span></button>
        <input type="hidden" id="booking-persona" name="persona" value="invizible" />
      </form>
      <p class="chat-footnote">A virtual conversation at the DJ booth</p>
    </section>

    <!-- Sections (hidden in AI-only mode for now) -->
    <main id="stage">
      <section id="hero" class="card center">
        <h1>DJ INVIZIBLE</h1>
        <p class="muted">An interactive site guided by an AI mascot. Ask about mixes, shows, booking & more.</p>
      </section>
      <section id="mixes" class="card"><h2>Mixes</h2></section>
      <section id="shows" class="card"><h2>Upcoming Shows</h2></section>
      <section id="book" class="card"><h2>Book Me</h2></section>
      <section id="about" class="card"><h2>About</h2></section>
      <section id="contact" class="card"><h2>Contact</h2></section>
    </main>
  </div>
